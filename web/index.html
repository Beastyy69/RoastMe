<!doctype html> <!-- ye HTML5 page hai -->
<html lang="en"> <!-- page ki bhasha English -->
  <head> <!-- page ki settings (dikhti nahi) -->
    <meta charset="UTF-8" /> <!-- emoji aur special characters sahi dikhein -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> <!-- browser tab ka icon -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- mobile pe sahi size -->
    <meta name="theme-color" content="#0a0a0b" /> <!-- mobile browser bar ka rang -->
    <meta name="description" content="RoastMe AI turns your bio, habits, face and quiz answers into playful, personalised roasts." /> <!-- Google search ka description -->
    <!-- Inter font Google Fonts se -->
    <link rel="preconnect" href="https://fonts.googleapis.com" /> <!-- font server se pehle hi connect (fast) -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> <!-- font files ka server -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" /> <!-- Inter font load -->
    <title>RoastMe AI</title> <!-- browser tab ka naam -->
  </head> <!-- head band -->
  <!-- React app isi div me render hota hai (src/main.jsx dekho) -->
  <body> <!-- page ka dikhne wala hissa -->
    <div id="root"></div> <!-- yahan poori React app aati hai -->
    <script type="module" src="/src/main.jsx"></script> <!-- app ka JavaScript shuru -->
  </body> <!-- body band -->
</html> <!-- html band -->
